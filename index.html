<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE Tutor · Reading牛津阅读（课前预习·课后复习）</title>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #faf5ff 50%, #fdf2f8 100%);
    min-height: 100vh; color:#111827; padding:24px 14px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }
  .top { text-align:center; margin-bottom: 22px; }
  .brand { display:inline-flex; align-items:center; gap:12px; margin-bottom:6px; }
  .brand img { height:38px; }
  .brand h1 { font-size:21px; font-weight:800;
    background: linear-gradient(90deg,#0052CC,#0066FF,#3399FF);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .sub { font-size:13px; color:#6b7280; }
  .pill { display:inline-block; margin-top:6px; font-size:11px; font-weight:700;
    background:#dcfce7; color:#166534; padding:3px 10px; border-radius:9999px; }

  /* ===== 教材中心门户（系列卡片网格） ===== */
  .portal { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:18px; }
  .series-card {
    --c:#0052CC;
    background:white; border-radius:18px; overflow:hidden; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,.07); border:1px solid #f1f5f9;
    transition:transform .2s, box-shadow .2s; display:flex; flex-direction:column;
  }
  .series-card:hover { transform:translateY(-4px); box-shadow:0 16px 30px rgba(0,0,0,.12); }
  .sc-head { height:6px; background:var(--c); }
  .sc-body { padding:18px 20px 16px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .sc-icon { width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:24px; color:white; background:var(--c); }
  .sc-name { font-size:18px; font-weight:800; color:#1f2937; }
  .sc-desc { font-size:12.5px; color:#6b7280; line-height:1.7; }
  .sc-levels { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
  .lv-chip { font-size:11px; font-weight:700; padding:3px 9px; border-radius:9999px; }
  .lv-chip.on { background:#eff6ff; color:var(--c); border:1px solid #bfdbfe; }
  .lv-chip.off { background:#f3f4f6; color:#9ca3af; border:1px dashed #d1d5db; }
  .sc-foot { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:10px; }
  .sc-prog { font-size:12px; font-weight:700; color:#16a34a; }
  .sc-go { font-size:13px; font-weight:700; color:var(--c); }
  .series-card.stub { border:2px dashed #cbd5e1; background:#fbfdff; }
  .series-card.stub .sc-icon { background:#e2e8f0; color:#64748b; }
  .series-card.stub .sc-name { color:#64748b; }
  .series-card.stub .sc-go { color:#64748b; }
  .err { padding:20px; background:#fef2f2; border:1px solid #fca5a5; border-radius:12px; color:#991b1b; font-size:14px; }

  /* ===== 进入系列后的阅读视图 ===== */
  .viewer { display:none; }
  .back-bar { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
  .back-btn { padding:8px 16px; border:1px solid #e5e7eb; background:white; border-radius:10px;
    font-size:13px; font-weight:600; color:#374151; cursor:pointer; transition:all .2s; }
  .back-btn:hover { background:#f3f4f6; }
  .viewer-title { font-size:16px; font-weight:800; color:#0052CC; }

  .audio-bar { display:flex; align-items:center; gap:12px; background:white; border-radius:14px; padding:12px 18px;
    box-shadow:0 4px 12px rgba(0,0,0,.06); margin-bottom:18px; flex-wrap:wrap; }
  .audio-bar .hint { font-size:12px; color:#9ca3af; }
  .audio-bar select { padding:8px 12px; border-radius:10px; border:1px solid #e5e7eb; font-size:13px; outline:none; }
  .play-all { margin-left:auto; padding:8px 16px; border:none; border-radius:10px; cursor:pointer;
    background:linear-gradient(135deg,#0891b2,#06b6d4); color:white; font-weight:600; font-size:13px; display:flex; align-items:center; gap:6px; }

  .level-tabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
  .level-tab { padding:7px 16px; border-radius:12px; background:white; border:1px solid #e5e7eb;
    font-size:13px; color:#374151; cursor:pointer; transition:all .2s; }
  .level-tab.active { background:#eff6ff; border-color:#0052CC; color:#0052CC; font-weight:700; }
  .level-tab.locked { color:#9ca3af; border-style:dashed; cursor:not-allowed; }

  .unit-tabs { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px; }
  .unit-tab { padding:8px 14px; border-radius:12px; border:1px solid #dbeafe; background:white;
    font-size:13px; font-weight:600; color:#4338ca; cursor:pointer; transition:all .2s; max-width:280px; }
  .unit-tab.active { background:linear-gradient(135deg,#0052CC,#0066FF); color:white; border-color:transparent; box-shadow:0 8px 20px rgba(0,82,204,.25); }

  .lesson-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
  .lesson-tab { padding:6px 13px; border-radius:10px; background:white; border:1px solid #e5e7eb;
    font-size:12px; color:#374151; cursor:pointer; transition:all .2s; }
  .lesson-tab.active { background:#eff6ff; border-color:#0052CC; color:#0052CC; font-weight:700; }

  .phonics { background:linear-gradient(135deg,#ede9fe,#f5f3ff); border:1px solid #ddd6fe;
    border-radius:16px; padding:12px 18px; margin-bottom:20px; display:none; align-items:center; gap:12px; }
  .phonics-icon { width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,#7c3aed,#a855f7);
    display:flex; align-items:center; justify-content:center; color:white; flex-shrink:0; font-size:15px; }
  .phonics-text { font-size:13px; color:#5b21b6; font-weight:600; }

  .section-title { display:flex; align-items:center; gap:10px; font-size:17px; font-weight:700; margin:24px 0 14px; }
  .section-title .dot { width:8px; height:22px; border-radius:6px; background:linear-gradient(135deg,#0052CC,#0066FF); }

  .vocab-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .word-card { background:white; border-radius:16px; padding:16px; box-shadow:0 4px 12px rgba(0,0,0,.06);
    border:1px solid #f3f4f6; position:relative; transition:transform .2s, box-shadow .2s; }
  .word-card:hover { transform:translateY(-3px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
  .word-en { font-size:19px; font-weight:800; color:#0052CC; letter-spacing:.3px; }
  .word-cn { font-size:13px; color:#6b7280; margin-top:4px; }
  .speak-btn { position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
    border:none; background:linear-gradient(135deg,#0052CC,#0066FF); color:white; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; transition:transform .15s; box-shadow:0 4px 10px rgba(0,82,204,.3); }
  .speak-btn:hover { transform:scale(1.12); }
  .speak-btn:active { transform:scale(.95); }
  .speak-btn.speaking { animation:pulse .6s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(0,82,204,.5)} 50%{box-shadow:0 0 0 8px rgba(0,82,204,0)} }

  .sentence-list { display:flex; flex-direction:column; gap:12px; }
  .sentence-card { background:white; border-radius:14px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.05);
    border:1px solid #f3f4f6; display:flex; align-items:center; gap:14px; transition:all .2s; }
  .sentence-card:hover { box-shadow:0 8px 18px rgba(0,0,0,.08); }
  .sentence-num { flex-shrink:0; width:28px; height:28px; border-radius:8px; background:#eff6ff; color:#0052CC;
    font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .sentence-text { flex:1; font-size:15px; color:#374151; line-height:1.6; }
  .sentence-card .speak-btn { position:static; flex-shrink:0; }

  .story-box { background:linear-gradient(135deg,#f0fdfa,#ecfeff); border:1px solid #a5f3fc; border-radius:16px;
    padding:20px; font-size:14px; line-height:1.9; color:#0e7490; }

  .note { margin-top:28px; font-size:12px; color:#9ca3af; text-align:center; line-height:1.8; }
  .note code { background:#f3f4f6; padding:2px 6px; border-radius:6px; color:#6b7280; }
  .err { background:#fef2f2; color:#b91c1c; padding:16px; border-radius:12px; font-size:13px; text-align:center; }
  .addhint { background:white; border:1px solid #e5e7eb; border-radius:16px; padding:20px 24px; line-height:1.9;
    font-size:13.5px; color:#374151; box-shadow:0 6px 16px rgba(0,0,0,.07); }
  .addhint h3 { color:#0052CC; margin-bottom:8px; }
  .addhint code { background:#f3f4f6; padding:2px 7px; border-radius:6px; color:#0052CC; font-size:12.5px; }
  .addhint ol { padding-left:20px; margin-top:6px; }

  /* ===== 课前预习 / 课后复习 模块 ===== */
  .module { background:white; border:1px solid #eef2ff; border-radius:20px; padding:22px 20px 8px;
    box-shadow:0 6px 18px rgba(0,82,204,.06); margin:18px 0; }
  .module-head { display:flex; align-items:center; gap:12px; font-size:19px; font-weight:800;
    padding:12px 18px; border-radius:14px; margin:-22px -20px 14px; color:white; }
  .module-head .mh-icon { font-size:22px; }
  .module-head.preview { background:linear-gradient(135deg,#0052CC,#0066FF); }
  .module-head.review { background:linear-gradient(135deg,#0891b2,#06b6d4); }
  .module-note { font-size:13px; color:#6b7280; margin:-4px 2px 14px; line-height:1.7; }
  .lesson-audio { background:linear-gradient(135deg,#ecfeff,#f0fdfa); border:1px solid #a5f3fc;
    border-radius:16px; padding:18px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .lesson-audio .la-icon { width:46px; height:46px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(135deg,#0891b2,#06b6d4); color:white; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .lesson-audio .la-info { flex:1; min-width:160px; }
  .lesson-audio .la-title { font-size:15px; font-weight:700; color:#0e7490; }
  .lesson-audio .la-sub { font-size:12px; color:#6b7280; margin-top:2px; }
  .lesson-play-btn { margin-left:auto; padding:12px 22px; border:none; border-radius:14px; cursor:pointer;
    background:linear-gradient(135deg,#0891b2,#06b6d4); color:white; font-weight:700; font-size:15px;
    display:flex; align-items:center; gap:8px; box-shadow:0 8px 20px rgba(8,145,178,.3); transition:transform .15s; }
  .lesson-play-btn:hover { transform:translateY(-2px); }
  .lesson-play-btn:active { transform:scale(.97); }
  .lesson-play-btn.speaking { animation:pulse .6s infinite; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="logo.png" alt="EDGE Tutor"><h1>Reading 牛津阅读</h1></div>
    <div class="sub">美国小学分级读物 · 课前预习生词句型 + 课后复习课文朗读（英式发音）</div>
    <div class="pill">本地神经网络 TTS · 离线可用 · 对标有道发音</div>
  </div>

  <!-- 教材中心门户 -->
  <div class="portal" id="portal"></div>

  <!-- 进入某系列后的阅读视图 -->
  <div class="viewer" id="viewer">
    <div class="back-bar">
      <button class="back-btn" id="backBtn"><i class="fa fa-arrow-left"></i> 返回教材中心</button>
      <span class="viewer-title" id="viewerTitle"></span>
    </div>

    <div class="audio-bar">
      <i class="fa fa-volume-up" style="color:#0052CC"></i>
      <select id="voiceSelect"><option>浏览器语音(兜底)</option></select>
      <span class="hint">主发音由本地 Kokoro 神经网络生成，无需联网/密钥</span>
      <button class="play-all" id="playAllBtn"><i class="fa fa-play"></i> 朗读整课</button>
    </div>

    <div class="level-tabs" id="levelTabs"></div>
    <div class="unit-tabs" id="unitTabs"></div>
    <div class="lesson-tabs" id="lessonTabs"></div>

    <div id="phonicsBox" class="phonics"></div>

    <!-- 模块一：课前预习 -->
    <div class="module">
      <div class="module-head preview"><span class="mh-icon">📘</span> 课前预习 · 上课前自己看</div>
      <div class="module-note">先跟读生词和重点句型，带着内容去上课，效果更好。</div>
      <div class="section-title"><span class="dot"></span>📝 生词 Vocabulary</div>
      <div class="vocab-grid" id="vocabGrid"></div>
      <div class="section-title"><span class="dot"></span>📖 重点句子 Key Sentences</div>
      <div class="sentence-list" id="sentenceList"></div>
    </div>

    <!-- 模块二：课后复习 -->
    <div class="module">
      <div class="module-head review"><span class="mh-icon">🎧</span> 课后复习 · 上完课听读</div>
      <div class="module-note">听课文朗读、复习整课内容，把当天学的牢牢记住。</div>
      <div class="section-title"><span class="dot"></span>📚 课文摘要 Story</div>
      <div class="story-box" id="storyBox"></div>
      <div class="section-title"><span class="dot"></span>🎧 整课朗读 Lesson</div>
      <div class="lesson-audio" id="lessonAudioBox">
        <div class="la-icon"><i class="fa fa-headphones"></i></div>
        <div class="la-info">
          <div class="la-title">整课朗读音频</div>
          <div class="la-sub">老师带读整篇课文，可反复听</div>
        </div>
        <button class="lesson-play-btn" id="lessonPlayBtn"><i class="fa fa-play"></i> 播放整课</button>
      </div>
    </div>

    <div class="note" id="footNote"></div>
  </div>
</div>

let DATA = null;
let cur = { series:null, level:null, unit:null, lesson:null };

// ===== 教材系列元数据：新增教材只需在此追加一项 + 在 reading_parsed_all.json 加对应系列键 =====
const SERIES_META = {
  oxford: {
    name:'Reading牛津阅读', color:'#0052CC', icon:'📘',
    desc:'美国小学主流分级读物（Reach Higher 改编），逐课生词 + 重点句型 + 课文朗读，英式发音。',
    levels:['REL1','REL2','REL3','REL4','REL5','REL6','REL7','REL8','REL9']
  }
};

function seriesKeys(){ return Object.keys(DATA).map(k=>k.split('/')[0]).filter((v,i,a)=>a.indexOf(v)===i); }
function levelKeysFor(series){ return Object.keys(DATA).filter(k=>k.startsWith(series+'/')).map(k=>k.split('/')[1]); }
function levelObj(series,level){ return DATA[series+'/'+level]; }
function metaOf(s){ return SERIES_META[s] || { name:s, color:'#0052CC', icon:'📚', desc:'', levels:[] }; }

// === 教材中心门户 ===
function renderPortal(){
  document.getElementById('viewer').style.display='none';
  const box=document.getElementById('portal'); box.innerHTML=''; box.style.display='grid';
  seriesKeys().forEach(s=>{
    const m=metaOf(s);
    const avail=levelKeysFor(s);
    const total=m.levels.length, done=avail.length;
    const card=document.createElement('div'); card.className='series-card'; card.style.setProperty('--c', m.color);
    card.innerHTML=`
      <div class="sc-head"></div>
      <div class="sc-body">
        <div class="sc-icon">${m.icon}</div>
        <div class="sc-name">${m.name}</div>
        <div class="sc-desc">${m.desc}</div>
        <div class="sc-levels">${m.levels.map(L=>{
          const ok=avail.includes(L);
          return `<span class="lv-chip ${ok?'on':'off'}">${L}${ok?'':' · 待补充'}</span>`;
        }).join('')}</div>
        <div class="sc-foot"><span class="sc-prog">已上线 ${done}/${total} 级</span><span class="sc-go">进入 →</span></div>
      </div>`;
    card.onclick=()=>enterSeries(s);
    box.appendChild(card);
  });
}

function showAddHint(){
  const box=document.getElementById('portal'); box.style.display='block'; box.innerHTML='';
  const d=document.createElement('div'); d.className='addhint';
  d.innerHTML=`<h3><i class="fa fa-plus-circle"></i> 如何新增一套教材？</h3>
    框架已支持「系列 → 级别 → 单元 → 课」四级结构，扩展只需两步：
    <ol>
      <li>把该教材的<strong>词汇句型手册 PDF</strong>（每课含 生词 / 句型 / 课文）放到工作区；</li>
      <li>在 <code>parse_reading.py</code> 加一段解析规则，运行后在 <code>reading_parsed_all.json</code> 生成 <code>系列/级别</code> 键；<br>
        并在本页 <code>SERIES_META</code> 追加一项（名称 / 配色 / 完整级别阶梯）。</li>
    </ol>
    随后运行 <code>gen_audio_kokoro.py</code> 用本地 Kokoro 生成发音音频，刷新即可在教材中心看到新系列与各级别（缺失级别自动显示「待补充」）。
    <div style="margin-top:14px;"><button class="back-btn" onclick="renderPortal()"><i class="fa fa-arrow-left"></i> 返回教材中心</button></div>`;
  box.appendChild(d);
}

function enterSeries(s){
  cur.series=s; cur.level=null; cur.unit=null; cur.lesson=null;
  document.getElementById('portal').style.display='none';
  document.getElementById('viewer').style.display='block';
  document.getElementById('viewerTitle').textContent=metaOf(s).name;
  const lv=levelKeysFor(s);
  cur.level=lv[0];
  renderLevelTabs(); renderUnitTabs();
}

// === 级别 / 单元 / 课 切换 ===
function renderLevelTabs(){
  const box=document.getElementById('levelTabs'); box.innerHTML='';
  if(!cur.series) return;
  const m=metaOf(cur.series); const avail=levelKeysFor(cur.series);
  m.levels.forEach(L=>{
    const ok=avail.includes(L);
    const t=document.createElement('div');
    t.className='level-tab'+(cur.level===L?' active':'')+(ok?'':' locked');
    t.textContent=ok?L:(L+' · 待补充');
    if(ok) t.onclick=()=>{ cur.level=L; cur.unit=null; cur.lesson=null; renderUnitTabs(); };
    box.appendChild(t);
  });
  // 同步标题
  document.getElementById('viewerTitle').textContent = cur.series
    ? `${m.name} · ${cur.level||''}` : '';
}
function renderUnitTabs(){
  const box=document.getElementById('unitTabs'); box.innerHTML='';
  const lvl=cur.series&&cur.level?levelObj(cur.series,cur.level):null;
  if(!lvl) return;
  lvl.units.forEach((u,ui)=>{
    const t=document.createElement('div'); t.className='unit-tab'+(cur.unit===ui?' active':'');
    t.textContent=u.name; t.title=u.name;
    t.onclick=()=>{ cur.unit=ui; cur.lesson=null; renderLessonTabs(); };
    box.appendChild(t);
  });
  if(cur.unit==null && lvl.units.length) cur.unit=0;
  renderLessonTabs();
}
function renderLessonTabs(){
  const box=document.getElementById('lessonTabs'); box.innerHTML='';
  const lvl=cur.series&&cur.level?levelObj(cur.series,cur.level):null;
  if(!lvl||cur.unit==null) return;
  const lessons=lvl.units[cur.unit].lessons;
  lessons.forEach((les,li)=>{
    const t=document.createElement('div'); t.className='lesson-tab'+(cur.lesson===li?' active':'');
    t.textContent=les.title.replace(/^L\d+\s*[—\s]*/,'').slice(0,18); t.title=les.title;
    t.onclick=()=>{ cur.lesson=li; renderLesson(); };
    box.appendChild(t);
  });
  if(cur.lesson==null) cur.lesson=0;
  renderLesson();
}
function renderLesson(){
  const lvl=levelObj(cur.series,cur.level); if(!lvl||cur.unit==null||cur.lesson==null) return;
  const les=lvl.units[cur.unit].lessons[cur.lesson];
  const a=les.audio||{};
  const pb=document.getElementById('phonicsBox');
  if(les.phonics){ pb.innerHTML=`<div class="phonics-icon"><i class="fa fa-music"></i></div><div class="phonics-text">拼读重点：${les.phonics}</div>`; pb.style.display='flex'; }
  else pb.style.display='none';
  const vg=document.getElementById('vocabGrid'); vg.innerHTML='';
  (les.vocab||[]).forEach((v,i)=>{
    const c=document.createElement('div'); c.className='word-card';
    c.innerHTML=`<div class="word-en">${v.en}</div><div class="word-cn">${v.cn||''}</div>
      <button class="speak-btn"><i class="fa fa-volume-up"></i></button>`;
    c.querySelector('.speak-btn').onclick=(e)=>playAudio((a.vocab||[])[i], v.en, e.currentTarget);
    vg.appendChild(c);
  });
  const sl=document.getElementById('sentenceList'); sl.innerHTML='';
  (les.sentences||[]).forEach((s,i)=>{
    const c=document.createElement('div'); c.className='sentence-card';
    c.innerHTML=`<div class="sentence-num">${i+1}</div><div class="sentence-text">${s}</div>
      <button class="speak-btn"><i class="fa fa-volume-up"></i></button>`;
    c.querySelector('.speak-btn').onclick=(e)=>playAudio((a.sentences||[])[i], s, e.currentTarget);
    sl.appendChild(c);
  });
  const sb=document.getElementById('storyBox');
  if(les.story){ sb.style.display='block'; sb.textContent=les.story;
    sb.onclick=(e)=>playAudio(a.story, les.story, e.currentTarget); sb.style.cursor='pointer'; sb.title='点击朗读'; }
  else { sb.style.display='none'; }
  document.getElementById('playAllBtn').onclick=(e)=>playAudio(a.lesson, null, e.currentTarget);
  document.getElementById('lessonPlayBtn').onclick=(e)=>playAudio(a.lesson, null, e.currentTarget);
  document.getElementById('footNote').innerHTML =
    `数据：${cur.series}/${cur.level} · ${lvl.units[cur.unit].name} · ${les.title}<br>`+
    `发音：本地 Kokoro 神经网络 TTS（英式 bf_emma）· 离线可用 · 缺文件时自动回退浏览器语音`;
}

// === 播放逻辑：本地 mp3 优先，失败回退浏览器 Web Speech ===
let audioEl=null;
function playAudio(url, text, btn){
  if(btn){ document.querySelectorAll('.speak-btn.speaking').forEach(b=>b.classList.remove('speaking')); btn.classList.add('speaking'); }
  const stop=()=>{ if(btn) btn.classList.remove('speaking'); };
  if(url){
    if(audioEl) audioEl.pause();
    audioEl=new Audio(url);
    audioEl.onended=stop; audioEl.onerror=()=>{ stop(); if(text) fallbackSpeak(text,btn); };
    audioEl.play().catch(()=>{ if(text) fallbackSpeak(text,btn); });
    return;
  }
  if(text) fallbackSpeak(text,btn);
}
function fallbackSpeak(text, btn){
  if(!text) return;
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=0.95;
  u.onend=()=>{ if(btn) btn.classList.remove('speaking'); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function initVoices(){
  const sel=document.getElementById('voiceSelect');
  const vs=speechSynthesis.getVoices();
  sel.innerHTML='<option value="">浏览器语音(兜底)</option>'+vs.map(v=>`<option value="${v.lang}">${v.name} (${v.lang})</option>`).join('');
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=initVoices; initVoices(); }

document.getElementById('backBtn').onclick=renderPortal;

async function boot(){
  // 数据已内嵌（相对路径），直接用于 GitHub Pages / 任意静态托管
  if(typeof INLINE_DATA !== 'undefined' && INLINE_DATA){
    DATA = INLINE_DATA;
    renderPortal();
  } else {
    document.getElementById('portal').innerHTML=
      `<div style="padding:40px 20px;text-align:center;background:#fef2f2;border:2px solid #fca5a5;border-radius:16px;margin:20px 0;">
        <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
        <div style="font-size:18px;font-weight:800;color:#991b1b;margin-bottom:8px;">页面无法加载数据</div>
        <div style="font-size:13px;color:#6b7280;margin-top:12px;">请确认 INLINE_DATA 已正确生成。</div>
      </div>`;
  }
}
boot();
</script>
